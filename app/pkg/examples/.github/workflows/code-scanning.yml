name: prose-code-scanning

on:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save ai-text-patterns

      # `|| true` keeps the upload step reachable: we want the findings in the
      # Security tab, not a red build.
      - run: npx slop "docs/**/*.md" --format sarif > prose.sarif || true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prose.sarif
          category: ai-text-patterns
